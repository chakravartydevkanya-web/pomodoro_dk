<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="art-wrap">
      <div class="art" role="img" aria-label="Blurred painting placeholder"></div>
    </div>
    <div class="ring"><span>25:00</span></div>
    <div class="buttons">
      <button class="btn" type="button">Start</button>
      <button class="btn alt" type="button">Reset</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
